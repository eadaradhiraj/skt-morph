<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>skt-morph WASM</title>
<style>
body{font-family:"Noto Sans Devanagari",system-ui,sans-serif;max-width:920px;margin:2rem auto;padding:0 1rem}
nav button{margin-right:.5rem;margin-bottom:.35rem;padding:.4rem .8rem;border:1px solid #ccc;background:#f5f5f5;cursor:pointer}
nav button.active{background:#222;color:#fff}
section{margin-top:1rem;border:1px solid #ddd;padding:1rem}
pre{background:#f7f7f7;padding:.8rem;overflow:auto;white-space:pre-wrap;font-size:.85em}
input,select{padding:.4rem;margin:.2rem;font-size:1rem}
table{border-collapse:collapse;width:100%;margin-top:.5rem}
th,td{border:1px solid #ccc;padding:.45rem .6rem;text-align:left}
th{background:#f3f3f3}
.empty{color:#999}
.hint,.count{font-size:.9em;color:#555;margin:.4rem 0}
.miss{color:#900;margin:.4rem 0}
.parse{border:1px solid #e2e2e2;padding:.75rem 1rem;margin:.6rem 0;background:#fafafa}
.parse h3{margin:0 0 .4rem;font-size:1.05rem}
.parse dl{margin:0;display:grid;grid-template-columns:9rem 1fr;gap:.15rem .75rem}
.parse dt{color:#666}
.parse dd{margin:0;font-weight:600}
.hits{padding-left:1.2rem}
code{font-size:.85em;color:#666}
details{margin-top:.6rem}
</style>
</head>
<body>
<h1>skt-morph <small>तिङन्त · कृदन्त · सुबन्त</small></h1>
<nav>
<button id="tab-analyze" class="active">विश्लेषण</button>
<button id="tab-verb">तिङन्त</button>
<button id="tab-noun">सुबन्त</button>
<button id="tab-krdanta">कृदन्त</button>
</nav>

<section id="sec-analyze">
  <input id="q" placeholder="रामेण / rAmeNa / ट्रम्पेण" style="width:360px" lang="hi">
  <button id="btn-analyze">विश्लेषण</button>
  <button id="btn-search">धातु खोज</button>
  <div id="out-analyze"></div>
</section>

<section id="sec-verb" hidden>
  <input id="dhatu" placeholder="धातु भू / bhU / 01.0001" value="भू">
  <select id="lakara">
    <option value="plat">लट् (परस्मै)</option>
    <option value="plan">लङ्</option>
    <option value="plot">लोट्</option>
    <option value="plrt">लृट्</option>
    <option value="pvidhilin">विधिलिङ्</option>
    <option value="plit">लिट्</option>
    <option value="alat">लट् (आत्मने)</option>
  </select>
  <input id="verb-prefix" placeholder="उपसर्ग प्र, सम्" style="width:180px">
  <button id="btn-verb">गण (९)</button>
  <button id="btn-verb1">एक (प्रथम एकवचन)</button>
  <div class="hint">उपसर्ग: सम्+भू → सम्भू, प्र+इ → प्रे</div>
  <div id="out-verb"></div>
</section>

<section id="sec-noun" hidden>
  <input id="nbase" placeholder="प्रातिपदिक राम / rAma / ट्रम्प" value="राम">
  <select id="linga">
    <option value="pum">पुंलिङ्ग</option>
    <option value="stri">स्त्रीलिङ्ग</option>
    <option value="nap">नपुंसकलिङ्ग</option>
  </select>
  <button id="btn-noun">सुबन्त</button>
  <div id="out-noun"></div>
</section>

<section id="sec-krdanta" hidden>
  <input id="kdhatu" placeholder="धातु भू / bhU" value="भू">
  <select id="pratyaya">
    <option value="kta">क्त</option>
    <option value="ktavatu">क्तवतु</option>
    <option value="tumun">तुमुन्</option>
    <option value="ktvA">क्त्वा</option>
    <option value="lyap">ल्यप्</option>
    <option value="Satf">शतृ</option>
    <option value="SAnac">शानच्</option>
    <option value="lyuw">ल्युट्</option>
    <option value="tavya">तव्य</option>
    <option value="anIyar">अनीयर्</option>
  </select>
  <input id="krd-prefix" placeholder="उपसर्ग सम्, प्र" style="width:160px">
  <button id="btn-krdanta">कृदन्त</button>
  <div class="hint">सम्+भू+क्त्वा → सम्भूत्वा</div>
  <div id="out-krdanta"></div>
</section>

<script type="module" src="./demo.js"></script>
</body>
</html>
