[package]
name = "skt-morph"
version = "0.1.0"
edition = "2021"
description = "Sanskrit morphology - conjugations, participles, declensions (WASM)"
license = "MIT"
repository = "https://github.com/eadaradhiraj/skt-morph"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[dependencies.rusqlite]
version = "0.31"
features = ["bundled"]
optional = true

[features]
default = ["hardcode"]
hardcode = []
native-db = ["rusqlite"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[[bin]]
name = "validate"
path = "src/bin/validate.rs"
required-features = ["native-db"]

[[bin]]
name = "time_analyze"
path = "src/bin/time_analyze.rs"

[profile.release]
opt-level = 3
lto = true
