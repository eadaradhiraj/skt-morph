[package]
name = "skt-morph"
version = "0.1.0"
edition = "2021"
description = "Sanskrit morphology - conjugations, participles, declensions (WASM)"
license = "MIT"
repository = "https://github.com/eadaradhiraj/skt-morph"
readme = "README.MD"
keywords = ["sanskrit", "panini", "morphology", "wasm", "slp1"]
categories = ["science", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
flate2 = { version = "1.0", optional = true }
once_cell = "1.19"
base64 = { version = "0.22", optional = true }

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[dependencies.rusqlite]
version = "0.31"
features = ["bundled"]
optional = true

[features]
default = []
native-db = ["rusqlite"]
wasm-gold = ["flate2"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[[bin]]
name = "validate"
path = "src/bin/validate.rs"
required-features = ["native-db"]

[[bin]]
name = "time_analyze"
path = "src/bin/time_analyze.rs"

[profile.release]
opt-level = 3
lto = true

[lints.clippy]
# SLP1 chopping (`[..len-1]`) is the usual it-strip; not worth strip_suffix churn.
manual_strip = "allow"
too_many_arguments = "allow"
