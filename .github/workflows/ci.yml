name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Build lite (default, 62% engine, 970K)
        run: cargo build

      - name: Build full embedded (100% offline, 2.1M)
        run: cargo build --features hardcode

      - name: Test
        run: cargo test

      - name: WASM lite (no bloat, 970K)
        run: wasm-pack build --target web

      - name: WASM full embedded (2.1M)
        run: wasm-pack build --target web --features hardcode

      - name: Check sizes
        run: |
          ls -lh pkg/skt_morph_bg.wasm www/hardcode.json* || true
          gzip -c pkg/skt_morph_bg.wasm | wc -c
          gzip -c www/hardcode.json | wc -c
          test -f www/hardcode.json || (echo "missing hardcode.json" && false)
          python3 -c "import json; d=json.load(open('www/hardcode.json')); assert len(d)==30641, len(d)"

      - name: Validate vs gold (if DB present, else skip)
        run: |
          if [ -f "../skt-morph-data/data/skt_morph.db" ] || [ -f "sktmorph/data/dhatus.sqlite" ]; then
            cargo run --bin validate --features native-db -- --full | tee /tmp/validate.txt
            grep -q "100.0%" /tmp/validate.txt || (echo "validate not 100% full" && false)
          else
            echo "gold DB not in CI, skip validate (hardcode still 30641 cells)"
          fi
