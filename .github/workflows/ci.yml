name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Build
        run: cargo build

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        env:
          RUSTFLAGS: -D warnings
        run: cargo test

      - name: WASM
        run: wasm-pack build --target web

      - name: Check sizes
        run: |
          ls -lh pkg/skt_morph_bg.wasm || true
          gzip -c pkg/skt_morph_bg.wasm | wc -c

      - name: Validate vs gold (if DB present, else skip)
        run: |
          if [ -f "../skt-morph-data/data/skt_morph.db" ] || [ -f "sktmorph/data/dhatus.sqlite" ]; then
            cargo run --bin validate --features native-db -- --full | tee /tmp/validate.txt
            cat /tmp/validate.txt
          else
            echo "gold DB not in CI, skip validate"
          fi
